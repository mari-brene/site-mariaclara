    for (const m of svg.matchAll(/class="l">([^<:]+):<\/text><text[^>]*class="v">(\d+)/g)) out[m[1]] = +m[2];

  // ================= Terminal =================
  const screen = document.getElementById("screen");
  const out = document.getElementById("output");
  const row = document.getElementById("input-row");
  const input = document.getElementById("cmd");
  const ghostTyped = document.querySelector("#ghost .typed");
  const reduzido = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const historico = [];
  let posHist = 0, ocupado = false, jogando = false;

  const rolar = () => { screen.scrollTop = screen.scrollHeight; };
  const imprimir = (html, cls = "") => {
    const div = document.createElement("div");
    div.className = "line " + cls;
    div.innerHTML = html;
    out.appendChild(div);

  };
  const espera = (ms) => new Promise((r) => setTimeout(r, reduzido ? 0 : ms));

  function mostrarInput(v) { row.hidden = !v; if (v) focar(); }
  function focar() { if (!ocupado && !jogando) input.focus({ preventScroll: true }); rolar(); }

  async function digitar(texto) {
    const div = imprimir(prompt() + '<span class="cmd"></span>');
    const alvo = div.querySelector(".cmd");
    for (const ch of texto) { alvo.textContent += ch; await espera(45 + Math.random() * 45); }
    await espera(200);
  }

  async function executar(bruto, ecoar = true) {
    const texto = bruto.trim();
    if (ecoar) imprimir(prompt() + `<span class="cmd">${esc(texto)}</span>`);
    if (!texto) return;
    historico.push(texto); posHist = historico.length;
    const [primeiro, ...args] = texto.split(/\s+/);
    const nome = ALIAS[primeiro.toLowerCase()] || primeiro.toLowerCase();
    const cmd = COMANDOS[nome];
    if (!cmd) { imprimir(L().notFound(esc(primeiro))); imprimir(""); return; }
    if (cmd.async) {
      ocupado = true; mostrarInput(false);
      const aviso = imprimir(`<span class="c-comment">${L().carregando}</span>`);
      try { aviso.innerHTML = await cmd.run(args); }
      catch { aviso.innerHTML = `<span class="c-red">${L().erroApi}</span>`; }
      ocupado = false; mostrarInput(true);
      imprimir(""); return;
    }
    const res = cmd.run(args);
    if (res) imprimir(res);
    if (res !== null && !jogando) imprimir("");
  }

  async function rodarDigitando(texto) {
    if (ocupado || jogando) return;
    ocupado = true; mostrarInput(false);
    await digitar(texto);
    ocupado = false;
    await executar(texto, false);
    if (!jogando) mostrarInput(true);
  }

  const sincronizarGhost = () => { ghostTyped.textContent = input.value.slice(0, input.selectionStart ?? input.value.length); };

    if (e.key === "Enter") { const v = input.value; input.value = ""; executar(v); }

    else if (e.key === "ArrowDown") { e.preventDefault(); posHist = Math.min(posHist + 1, historico.length); input.value = historico[posHist] || ""; }
    else if (e.key === "Tab") {
      e.preventDefault();
      const v = input.value.trim().toLowerCase();
      const nomes = ["sobre", "experiencia", "projetos", "stack", "formacao", "curriculo", "contato", "neofetch", "github", "whatsapp", "linkedin", "email", "tema", "lang", "clear", "help"].map(nomeCmd);
      const op = nomes.filter((c) => c.startsWith(v));
      if (op.length === 1) input.value = op[0];
      else if (op.length > 1) { imprimir(prompt() + esc(input.value)); imprimir(op.map((o) => `<span class="c-green">${o}</span>`).join("  ")); }
    } else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); out.innerHTML = ""; }

  function atualizarUI() {

  // ================= Snake =================
  function iniciarSnake() {
    jogando = true; mostrarInput(false);
    const J = L().jogo;
    const COLS = 24, ROWS = 14, CEL = Math.max(10, Math.min(18, Math.floor((screen.clientWidth - 44) / COLS)));
    const box = imprimir(`<div class="game"><span class="tag">${J.titulo}</span> <span class="c-comment">${J.ajuda}</span>
<canvas width="${COLS * CEL}" height="${ROWS * CEL}" aria-label="Snake"></canvas><span class="c-yellow">0</span>
<div class="pad"><button data-d="L">←</button><button data-d="U">↑</button><button data-d="D">↓</button><button data-d="R">→</button><button data-d="Q">${J.sair}</button></div></div>`);
    const cv = box.querySelector("canvas"), ctx = cv.getContext("2d"), placar = box.querySelector(".c-yellow");
    const cor = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    let cobra = [{ x: 6, y: 7 }, { x: 5, y: 7 }, { x: 4, y: 7 }], dir = { x: 1, y: 0 }, prox = dir, comida, pontos = 0, timer;
    const DIRS = { U: { x: 0, y: -1 }, D: { x: 0, y: 1 }, L: { x: -1, y: 0 }, R: { x: 1, y: 0 } };
    const mudar = (d) => { const n = DIRS[d]; if (n && (n.x !== -dir.x || n.y !== -dir.y)) prox = n; };
    const novaComida = () => { do { comida = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; } while (cobra.some((p) => p.x === comida.x && p.y === comida.y)); };
    novaComida();
    function desenhar() {
      ctx.fillStyle = cor("--bg-darker"); ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = cor("--pink"); ctx.fillRect(comida.x * CEL + 2, comida.y * CEL + 2, CEL - 4, CEL - 4);
      cobra.forEach((p, i) => { ctx.fillStyle = i ? cor("--green") : cor("--cyan"); ctx.fillRect(p.x * CEL + 1, p.y * CEL + 1, CEL - 2, CEL - 2); });
    }
    function passo() {
      dir = prox;
      const c = { x: cobra[0].x + dir.x, y: cobra[0].y + dir.y };
      if (c.x < 0 || c.y < 0 || c.x >= COLS || c.y >= ROWS || cobra.some((p) => p.x === c.x && p.y === c.y)) return fim();
      cobra.unshift(c);
      if (c.x === comida.x && c.y === comida.y) { pontos++; placar.textContent = pontos; novaComida(); clearInterval(timer); timer = setInterval(passo, Math.max(60, 130 - pontos * 3)); }
      else cobra.pop();
      desenhar();
    }
    const teclas = { ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R", w: "U", s: "D", a: "L", d: "R", W: "U", S: "D", A: "L", D: "R" };
    function onKey(e) {
      if (e.key === "Escape" || e.key === "q") { e.preventDefault(); return fim(); }
      if (teclas[e.key]) { e.preventDefault(); mudar(teclas[e.key]); }
    }
    let toque = null;
    cv.addEventListener("touchstart", (e) => { toque = e.touches[0]; }, { passive: true });
    cv.addEventListener("touchend", (e) => {
      if (!toque) return;
      const t = e.changedTouches[0], dx = t.clientX - toque.clientX, dy = t.clientY - toque.clientY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) mudar(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : (dy > 0 ? "D" : "U"));
      toque = null;
    });
    box.querySelectorAll(".pad button").forEach((b) => b.addEventListener("click", () => b.dataset.d === "Q" ? fim() : mudar(b.dataset.d)));
    let acabou = false;
    function fim() {
      if (acabou) return; acabou = true;
      clearInterval(timer); document.removeEventListener("keydown", onKey);
      box.querySelector(".pad").remove();
      const rec = Math.max(pontos, +(store.get("mari.snake") || 0)); store.set("mari.snake", rec);
      jogando = false;
      imprimir(J.fim(pontos, rec)); imprimir("");
      mostrarInput(true);
    }
    document.addEventListener("keydown", onKey);
    input.blur();
    desenhar();
    timer = setInterval(passo, 130);
  }

  // ================= Boot =================
  async function boot() {
    ocupado = true;
    const B = L().boot;
    const tempos = ["0.000", "0.214", "0.371", "0.502"];
    for (let i = 0; i < B.length; i++) { imprimir(`<span class="c-comment">[    ${tempos[i]}]</span> ${B[i]}${i ? ' <span class="c-green">ok</span>' : ""}`); await espera(150); }
    await espera(150);
    out.innerHTML = "";
    imprimir(`<div class="ascii">${esc(ASCII)}</div>`);
    imprimir(L().hello(PERFIL.nome, L().cargo));
    imprimir(L().hint);
    imprimir("");
    ocupado = false;
    await rodarDigitando(nomeCmd("sobre"));
  }

  document.documentElement.dataset.theme = tema;
  document.documentElement.lang = L().htmlLang;
  aplicarTema(tema);
  boot();
})();
</script>
